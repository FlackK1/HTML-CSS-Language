<!DOCTYPE html>
<html>
<head>
   <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Spirax" rel="stylesheet">
  <style>
    div.gallery {
      border: 1px solid #ccc;
    }
    div.gallery:hover {
      border: 1px solid #777;
    }
    div.gallery img {
      width: 100%;
      height: auto;
    }
    div.desc {
      padding: 15px;
      text-align: center;
    }
    * {
      box-sizing: border-box;
    }
    .responsive {
      padding: 0 6px;
      float: left;
      width: 24.99999%;
    }
    @media only screen and (max-width: 700px) {
      .responsive {
        width: 49.99999%;
        margin: 6px 0;
      }
    }
    @media only screen and (max-width: 500px) {
      .responsive {
        width: 100%;
      }
    }
    .clearfix:after {
      content: "";
      display: table;
      clear: both;
    }
    img {
      width: 100%;
      height: auto;
    }
    .row:after {
      content: "";
      clear: both;
      display: table;
    }
    [class*="col-"] {
      float: left;
      padding: 15px;
      width: 100%;
    }
    @media only screen and (min-width: 600px) {
      .col-s-1 {width: 8.33%;}
      .col-s-2 {width: 16.66%;}
      .col-s-3 {width: 25%;}
      .col-s-4 {width: 33.33%;}
      .col-s-5 {width: 41.66%;}
      .col-s-6 {width: 50%;}
      .col-s-7 {width: 58.33%;}
      .col-s-8 {width: 66.66%;}
      .col-s-9 {width: 75%;}
      .col-s-10 {width: 83.33%;}
      .col-s-11 {width: 91.66%;}
      .col-s-12 {width: 100%;}
    }
    @media only screen and (min-width: 768px) {
      .col-1 {width: 8.33%;}
      .col-2 {width: 16.66%;}
      .col-3 {width: 25%;}
      .col-4 {width: 33.33%;}
      .col-5 {width: 41.66%;}
      .col-6 {width: 50%;}
      .col-7 {width: 58.33%;}
      .col-8 {width: 66.66%;}
      .col-9 {width: 75%;}
      .col-10 {width: 83.33%;}
      .col-11 {width: 91.66%;}
      .col-12 {width: 100%;}
    }
    .custom-font {
       font-family: 'Spirax', cursive;
    }
    .header {
      text-align: center;
      background-color: #fefe22;
      color: #000000;
      padding: 15px;
    }
    .menu ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }
    .menu li {
      padding: 8px;
      margin-bottom: 7px;
      background-color: #fefe22;
      color: #000000;
    }
    .menu li a {
      text-decoration: none;
      color: black;
    }
    .menu li a:hover {
      color: blue;
    }
    .yellow-box {
      background-color: yellow;
      padding: 20px;
      border-radius: 10px;
      cursor: pointer;
    }
    .image-container {
      width: 50%;
      float: left;
    }
    .content {
      width: 50%;
      float: left;
    }
  </style>
</head>
<body>

<div class="header">
  <h1> Galleria </h1>
</div>

<div class="row">
  <div class="col-6 col-s-6 menu">
    <ul>
      <li class="yellow-box"> <a href="index1.html"> Infoa Meistä </a> </li>
      <li class="yellow-box"> <a href="index2.html">  Galleria</a> </li>
      <li class="yellow-box"> <a href="index3.html"> Varaukset </a> </li>
      <li class="yellow-box"> <a href="index4.html"> Videot </a> </li>
    </ul>
  </div>
  <div class="clearfix"></div>

  <div class="responsive">
    <div class="gallery">
      <a target="_blank" href="Kuva3.jpg">
        <img src="Kuva3.jpg" alt="Trolltunga Norway" width="600" height="600">
      </a>
      <div class="desc"> Meiltä löytyy yli 70 erilaista leivosta, joista kaikki tehdään käsin! Teemme mieluusti sinun reseptejä, tai autamme sinua sellaisen luomisessa. </div>
    </div>
  </div>

  <div class="responsive">
    <div class="gallery">
      <a target="_blank" href="Kuva4.jpg">
        <img src="Kuva4.jpg" alt="Forest" width="600" height="600">
      </a>
      <div class="desc"> On mageeta! </div>
    </div>
  </div>

  <div class="responsive">
    <div class="gallery">
      <a target="_blank" href="Kuva5.jpg">
        <img src="Kuva5.jpg" alt="Northern Lights" width="600" height="400">
      </a>
      <div class="desc"> Katso näitäkin herkkuja! </div>
    </div>
  </div>

  <div class="responsive">
    <div class="gallery">
      <a target="_blank" href="Kuva6.jpg">
        <img src="Kuva6.jpg" alt="Mountains" width="600" height="400">
      </a>
      <div class="desc"> Meillä on mukavaa </div>
    </div>
  </div>

  <div class="clearfix"></div>


</body>
</html>
